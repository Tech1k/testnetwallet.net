<style>
  :root{
    --bg:#14161b; --card:#1c1f27; --surface:#232730; --border:#2a2e37;
    --text:#e6e8ec; --muted:#9aa0ab; --faint:#8b919b;
    --accent:#6b86ff; --accent-soft:#9db2ff; --accent-bg:#1b2236; --accent-dim:#2e3a5c;
    --btn:#6b86ff; --on-accent:#ffffff;
    --ok:#4fbf75; --ok-bg:rgba(79,191,117,.13); --bad:#ef6b6b; --bad-bg:rgba(239,107,107,.13); --warn:#e0894f;
    --nav-bg:rgba(20,22,27,.86);
    --num:#e6e8ec;
    --r:16px; --r-sm:9px; --pill:999px;
    /* spacing scale (4px ramp) - single source of truth; use instead of hardcoded px */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono','JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace;
  }
  html[data-theme="light"]{
    --bg:#f7f7f7; --card:#ffffff; --surface:#f4f5f7; --border:#e5e5e5;
    --text:#1b1d23; --muted:#6b6b6b; --faint:#6b7280;   /* darker in light mode for WCAG-AA contrast on white cards */
    --accent:#5271ff; --accent-soft:#2f49c9; --accent-bg:#eef1ff; --accent-dim:#d7ddff;
    --btn:#3f57e0; --nav-bg:rgba(255,255,255,.85); --num:#1b1d23;
    --ok-bg:rgba(79,191,117,.13); --bad-bg:rgba(239,107,107,.13);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}
  .ext::after{content:"↗"; font-size:.72em; opacity:.5; margin-left:2px; vertical-align:1px; text-decoration:none; display:inline-block}
  code,.mono,pre{font-family:var(--mono)}
  h1,h2,h3{margin:0 0 .4em}
  button{font-family:inherit}

  /* nav */
  nav{position:sticky; top:0; z-index:30; background:var(--nav-bg); backdrop-filter:saturate(140%) blur(10px);
    border-bottom:1px solid var(--border)}
  .nav-inner{max-width:1000px; margin:0 auto; padding:12px 20px; display:flex; align-items:center;
    justify-content:space-between; gap:14px; flex-wrap:wrap}
  .brand{font-weight:700; font-size:19px; letter-spacing:.2px; color:var(--text); display:inline-flex; align-items:center; gap:9px}
  .brand:hover{text-decoration:none}
  .brand-ico{width:26px; height:26px; display:block; flex:none}
  .brand b{color:var(--accent)}
  .nav-links{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
  .nav-links a{color:var(--muted); font-weight:600; font-size:14px}
  .nav-links a:hover{color:var(--text); text-decoration:none}
  .theme-toggle{background:var(--surface); border:1px solid var(--border); color:var(--text);
    width:34px; height:34px; border-radius:var(--pill); cursor:pointer; font-size:16px; padding:0;
    display:inline-flex; align-items:center; justify-content:center; flex:none}

  main{max-width:1000px; margin:var(--s5) auto 70px; padding:0 20px}

  /* cards */
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--r); margin:var(--s4) 0; box-shadow:0 1px 3px rgba(0,0,0,.16)}
  .card.hero{background:var(--accent-bg); border-color:var(--accent-dim)}
  .hero-actions{display:flex; gap:var(--s3); margin-top:var(--s5)}
  .hero-actions .btn{flex:1; justify-content:center; padding:.85em 1em; font-size:15px}
  .card-h{padding:var(--s3) var(--s4); border-bottom:1px solid var(--border); font-weight:700; display:flex;
    align-items:center; justify-content:space-between; gap:var(--s3); flex-wrap:wrap}
  .card-b{padding:var(--s4)}
  .sub{color:var(--muted); font-size:13px; font-weight:400}

  /* buttons */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; background:var(--btn); color:var(--on-accent);
    border:1px solid var(--btn); border-radius:var(--pill); padding:.55em 1.1em; font-weight:600;
    font-size:14px; line-height:1.2; cursor:pointer; transition:filter .15s ease}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5; cursor:not-allowed; filter:none}
  .btn.ghost{background:transparent; color:var(--text); border-color:var(--border)}
  .btn.ghost:hover{border-color:var(--accent); background:var(--accent-bg)}
  .btn.sm{padding:.35em .8em; font-size:13px; line-height:1.2}
  .btn.danger{background:var(--bad); border-color:var(--bad)}
  /* buttons inside a control row pair with --r-sm inputs, not as standalone pills */
  .row>.btn{border-radius:var(--r-sm)}

  /* pills / tabs */
  .pills{display:flex; gap:var(--s2); flex-wrap:wrap}
  .pill{display:inline-flex; align-items:center; gap:7px; padding:.4em .9em; border-radius:var(--pill); border:1px solid var(--border); background:var(--surface);
    color:var(--muted); cursor:pointer; font-weight:600; font-size:13px; user-select:none}
  .pill:not(.disabled):hover{color:var(--text)}
  .pill.active{border-color:var(--accent); color:var(--accent); background:var(--accent-bg)}
  .pill.disabled{opacity:.45; cursor:not-allowed}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle}
  .coin-ico{width:18px; height:18px; border-radius:50%; display:block; flex:none}

  /* forms */
  label.fld{display:block; font-size:13px; color:var(--muted); margin:0 0 var(--s2)}
  input[type=text],input[type=password],input[type=number],textarea,select{
    width:100%; background:var(--surface); color:var(--text); border:1px solid var(--border);
    border-radius:var(--r-sm); padding:.6em .7em; font-size:14px; font-family:inherit}
  textarea{resize:vertical; min-height:78px; font-family:var(--mono)}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-dim); border-color:var(--accent)}
  /* keyboard focus ring for clickable non-form controls */
  .btn:focus-visible,.pill:focus-visible,.tab:focus-visible,.copy:focus-visible,.theme-toggle:focus-visible,
  .tx-item:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-sm)}
  .field{margin-bottom:var(--s4)}
  .row{display:flex; gap:var(--s3); flex-wrap:wrap; align-items:center}
  .row>input,.row>textarea,.row>select{flex:1; min-width:0}   /* only stretch form fields, never buttons */

  /* misc */
  .balance{font-size:2.6em; font-weight:700; font-family:var(--mono); color:var(--num); word-break:break-all; font-feature-settings:'zero' 0; font-variant-numeric:tabular-nums}
  .fiat{color:var(--muted); font-size:1.05em}
  .addr{font-family:var(--mono); font-size:13px; word-break:break-all; color:var(--text)}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
  .msg{padding:var(--s2) var(--s3); border-radius:var(--r-sm); font-size:13.5px; margin-top:var(--s3); word-break:break-word}
  .msg.ok{background:var(--ok-bg); border:1px solid var(--ok)}
  .msg.bad{background:var(--bad-bg); border:1px solid var(--bad)}
  .msg.warn{background:rgba(224,137,79,.13); border:1px solid var(--warn)}
  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th,td{text-align:left; padding:var(--s2) var(--s2); border-bottom:1px solid var(--border); vertical-align:middle}
  th{color:var(--muted); font-weight:600}
  td.amt{text-align:right; font-family:var(--mono); white-space:nowrap}
  tr.txrow{cursor:pointer} tr.txrow:hover td{background:var(--surface)}
  /* Cake-style transaction list */
  .tx-list{display:flex; flex-direction:column}
  .tx-item{display:flex; align-items:center; gap:var(--s3); padding:var(--s3) var(--s2); border-bottom:1px solid var(--border); cursor:pointer; border-radius:var(--r-sm)}
  .tx-item:hover{background:var(--surface)}
  .tx-ico{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; flex:none}
  .tx-ico.in{background:var(--ok-bg); color:var(--ok)}
  .tx-ico.out{background:var(--bad-bg); color:var(--bad)}
  .tx-main{flex:1; min-width:0}
  .tx-main .t1{font-weight:600}
  .tx-main .t2{color:var(--muted); font-size:12.5px}
  .tx-amt{font-family:var(--mono); white-space:nowrap; font-weight:600}
  .seed-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s2); margin:var(--s4) 0}
  .seed-word{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm);
    padding:var(--s2) var(--s3); font-family:var(--mono); font-size:13px}
  .seed-word b{color:var(--faint); margin-right:6px; font-weight:400}
  .qr{position:relative; background:#fff; padding:var(--s2); border-radius:var(--r-sm); display:inline-block; line-height:0}
  .qr>img{width:168px; height:168px; image-rendering:pixelated; display:block}
  .qr-logo{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:28%; height:28%;
    background:#fff; border-radius:7px; box-shadow:0 0 0 3px #fff; display:flex; align-items:center; justify-content:center}
  .qr-logo img{width:100%; height:100%; display:block}
  .tabbar{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:4px;
    flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{padding:var(--s3) var(--s4); cursor:pointer; color:var(--muted); font-weight:600; font-size:14px;
    border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent); border-bottom-color:var(--accent)}
  .copy{cursor:pointer; color:var(--accent); font-size:13px; font-weight:600; user-select:none; white-space:nowrap; display:inline-flex; align-items:center; padding:6px 8px; margin:-6px -2px}
  .stack{display:flex; flex-direction:column; gap:var(--s1)}
  .between{display:flex; align-items:center; justify-content:space-between; gap:var(--s3); flex-wrap:wrap}

  /* spacing utilities (reference --s* scale; for migrating inline margin-top/gap/divider magic numbers) */
  .mt-1{margin-top:var(--s1)} .mt-2{margin-top:var(--s2)} .mt-3{margin-top:var(--s3)} .mt-4{margin-top:var(--s4)}
  .gap-1{gap:var(--s1)} .gap-2{gap:var(--s2)} .gap-3{gap:var(--s3)}
  .stack-lg{display:flex; flex-direction:column; gap:var(--s2)}
  .hr{border:none; border-top:1px solid var(--border); margin:var(--s2) 0}
  .page-narrow{max-width:440px; margin:40px auto}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center;
    justify-content:center; padding:var(--s4); z-index:50}
  .modal{background:var(--card); border:1px solid var(--border); border-radius:var(--r);
    width:min(560px,100%); max-height:92vh; overflow:auto}

  footer{border-top:1px solid var(--border); color:var(--muted); font-size:13px}
  .foot-inner{max-width:1000px; margin:0 auto; padding:var(--s5) 20px; display:flex; gap:var(--s4); flex-wrap:wrap;
    align-items:center; justify-content:center}
  footer a{color:var(--muted)} footer a:hover{color:var(--text)}

  /* toasts */
  .toast-wrap{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:60;
    display:flex; flex-direction:column; gap:var(--s2); align-items:center; pointer-events:none}
  .toast{background:var(--card); border:1px solid var(--border); border-left:3px solid var(--accent);
    border-radius:var(--r-sm); padding:var(--s3) var(--s4); font-size:14px; box-shadow:0 6px 20px rgba(0,0,0,.35); max-width:90vw}
  .toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
  /* blurred (hidden) balance */
  .blurred{filter:blur(8px); user-select:none; cursor:pointer}
  /* progress bar (Monero sync): determinate (width) or animated indeterminate */
  .pbar{height:6px; border-radius:999px; background:var(--surface); overflow:hidden; margin:var(--s2) auto 0; max-width:300px}
  .pbar>span{display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease}
  .pbar.indet>span{width:40%; animation:pslide 1.15s ease-in-out infinite}
  @keyframes pslide{0%{transform:translateX(-110%)} 100%{transform:translateX(275%)}}

  @media (max-width:600px){
    .seed-grid{grid-template-columns:repeat(2,1fr)}
    .balance{font-size:clamp(1.5em,8vw,2em); word-break:normal; overflow-wrap:anywhere; line-height:1.15}
    main{padding:0 var(--s3)} .nav-inner{padding:var(--s3) var(--s3); gap:var(--s3)}
    .card{margin:var(--s3) 0} .card-b{padding:var(--s3)} .card-h{padding:var(--s3)}
    .nav-links{gap:var(--s3)} .foot-inner{gap:var(--s3); padding:var(--s4) var(--s3)}
    .nav-links a, .foot-inner a{padding:8px 4px; display:inline-flex; align-items:center}
    .hero-actions{gap:var(--s2)}
    .btn{min-height:44px} .btn.sm{min-height:44px} .pill{min-height:44px} .theme-toggle{width:44px; height:44px}
    input[type=text],input[type=password],input[type=number],textarea,select{min-height:44px; font-size:16px}
  }

  /* ---- Animations (functional feedback; all disabled under prefers-reduced-motion below) ---- */
  /* Tier 2: modal + toast entrances */
  .overlay{animation:tnwFade .16s ease}
  .modal{animation:tnwModalIn .2s cubic-bezier(.2,.8,.3,1)}
  .toast{animation:tnwToastIn .26s cubic-bezier(.2,.8,.3,1)}
  @keyframes tnwFade{from{opacity:0} to{opacity:1}}
  @keyframes tnwModalIn{from{opacity:0; transform:translateY(8px) scale(.985)} to{opacity:1; transform:none}}
  @keyframes tnwToastIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  /* Tier 1: result messages pop in (broadcast / sign / claim feedback everywhere) */
  .msg{animation:tnwMsgIn .22s ease both}
  .msg.ok{animation:tnwOkPop .34s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes tnwMsgIn{from{opacity:0; transform:translateY(-3px)} to{opacity:1; transform:none}}
  @keyframes tnwOkPop{0%{opacity:0; transform:scale(.97)} 60%{transform:scale(1.012)} 100%{opacity:1; transform:scale(1)}}
  /* Tier 1: balance change flash (green up / red down) */
  .balance.up{animation:tnwBalUp 1.1s ease}
  .balance.down{animation:tnwBalDown 1.1s ease}
  @keyframes tnwBalUp{0%{color:var(--ok); text-shadow:0 0 16px var(--ok-bg)} 100%{color:var(--num); text-shadow:none}}
  @keyframes tnwBalDown{0%{color:var(--bad)} 100%{color:var(--num); text-shadow:none}}
  /* Tier 1: skeleton shimmer for loading values */
  .skel{display:inline-block; border-radius:6px; min-height:1em; vertical-align:middle; color:transparent;
    background:linear-gradient(90deg, var(--surface) 25%, var(--border) 37%, var(--surface) 63%);
    background-size:400% 100%; animation:tnwShimmer 1.4s ease infinite}
  @keyframes tnwShimmer{0%{background-position:100% 0} 100%{background-position:0 0}}
  /* Tier 1: pending tx pulse ring + just-confirmed settle highlight */
  .tx-ico.pending{position:relative}
  .tx-ico.pending::after{content:''; position:absolute; inset:-3px; border-radius:50%; border:2px solid var(--warn); animation:tnwPulse 1.7s ease-out infinite}
  @keyframes tnwPulse{0%{opacity:.7; transform:scale(.82)} 100%{opacity:0; transform:scale(1.3)}}
  .tx-item.settle{animation:tnwSettle 1.3s ease}
  @keyframes tnwSettle{0%{background:var(--ok-bg)} 100%{background:transparent}}
  /* Tier 2: newly derived address row highlight */
  .row-new{animation:tnwRowNew 1.4s ease}
  @keyframes tnwRowNew{0%{background:var(--accent-bg)} 100%{background:transparent}}
  /* Tier 2: copy confirmation pop */
  .copied{animation:tnwPop .3s ease} .copy.copied{color:var(--ok)}
  @keyframes tnwPop{0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)}}
  /* Tier 1: error shake (wrong password / invalid input) */
  .shake{animation:tnwShake .4s cubic-bezier(.36,.07,.19,.97)}
  @keyframes tnwShake{10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)} 30%,50%,70%{transform:translateX(-5px)} 40%,60%{transform:translateX(5px)}}

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important}
    .tx-ico.pending::after{display:none}
  }
</style>
</head>
